      /* Spinner styles for page load */
      .app-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f9fafb;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(22, 163, 74, 0.2);
        border-radius: 50%;
        border-top-color: #16a34a;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
